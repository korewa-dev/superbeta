name: Build & Trigger Netlify Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
      - name: Commit generated HTML back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: rebuild HTML from content [skip ci]"
            git push
          fi
      - name: Trigger Netlify build hook
        run: curl -X POST -d '{}' https://api.netlify.com/build_hooks/6a732505dbda70b93a65ec35
