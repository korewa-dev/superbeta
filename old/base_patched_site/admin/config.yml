backend:
  name: github
  branch: main

media_folder: "base_patched_site/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: news
    label: News
    folder: content/d_events/news
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: slug, label: Slug, widget: string, required: false }
      - { name: description, label: Summary, widget: text, required: false, hint: "Optional. If blank, preview uses first 5-10 words from article body." }
      - { name: body, label: Body, widget: markdown }

  - name: politics
    label: Politics
    folder: content/d_events/politics
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: slug, label: Slug, widget: string, required: false }
      - { name: description, label: Summary, widget: text, required: false }
      - { name: body, label: Body, widget: markdown }

