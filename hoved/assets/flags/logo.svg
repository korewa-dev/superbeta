<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="ambient-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <radialGradient id="center-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e5e3d" />    <stop offset="65%" stop-color="#0e2b1c" />   <stop offset="100%" stop-color="#06140d" />  </radialGradient>

    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="44" 
          fill="url(#center-glow)" 
          stroke="url(#border-glow)" 
          stroke-width="1.5" 
          filter="url(#ambient-shadow)" />

  <circle cx="50" cy="50" r="42.5" 
          fill="none" 
          stroke="rgba(255,255,255,0.06)" 
          stroke-width="1" />

  <text x="50" y="53.5" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="58" 
        font-weight="900" 
        fill="#ff3b30" 
        text-anchor="middle" 
        dominant-baseline="middle">⚛</text>
</svg>
